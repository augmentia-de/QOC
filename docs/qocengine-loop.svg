<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d93025"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#777"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="1600" height="700" fill="#ffffff"/>

  <text x="800" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111">QocEngine Loop – Workflow-Run and Agent-Run</text>
  <text x="800" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555">Blue = starts Agent-Run · Red = result back · Gray = Loop · Dashed = persistence</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- ================= WORKFLOW LOOP (TOP) ================= -->
    <rect x="155" y="70" width="190" height="72" rx="10" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/>
    <text x="250" y="112" text-anchor="middle" font-size="17" font-weight="600" fill="#123">Workflow-Prompt</text>

    <rect x="375" y="70" width="190" height="72" rx="10" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/>
    <text x="470" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#123">WHILE</text>
    <text x="470" y="122" text-anchor="middle" font-size="11" fill="#456">stepNo &lt;= maxSteps</text>

    <rect x="595" y="70" width="190" height="72" rx="10" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/>
    <text x="690" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#123">STEP</text>
    <text x="690" y="122" text-anchor="middle" font-size="11" fill="#456">next Node</text>

    <rect x="815" y="70" width="190" height="72" rx="10" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/>
    <text x="910" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#123">TOOL/NODE</text>
    <text x="910" y="122" text-anchor="middle" font-size="11" fill="#456">Agent-Node</text>

    <rect x="1035" y="70" width="190" height="72" rx="10" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/>
    <text x="1130" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#123">RESULT</text>
    <text x="1130" y="122" text-anchor="middle" font-size="11" fill="#456">StepResult</text>

    <rect x="1255" y="70" width="190" height="72" rx="10" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="1.5"/>
    <text x="1350" y="112" text-anchor="middle" font-size="17" font-weight="600" fill="#123">End</text>

    <line x1="345" y1="106" x2="375" y2="106" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="565" y1="106" x2="595" y2="106" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="785" y1="106" x2="815" y2="106" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1005" y1="106" x2="1035" y2="106" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1225" y1="106" x2="1255" y2="106" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1240" y="96" text-anchor="middle" font-size="10" fill="#666">done</text>

    <!-- Workflow self-link -->
    <path d="M 1190 142 V 215 H 470 V 142" fill="none" stroke="#777" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
    <text x="830" y="233" text-anchor="middle" font-size="12" fill="#777">next</text>

    <!-- ================= DATABASE (MIDDLE, COMPACT) ================= -->
    <!-- Core & Events -->
    <rect x="180" y="250" width="1250" height="132" rx="10" fill="#c8f0ee" stroke="#3b6ea5" stroke-width="1.5"/>
    <text x="390" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#333">Core &amp; Events</text>
    <line x1="180" y1="280" x2="580" y2="280" stroke="#ccc" stroke-width="1"/>
    <text x="190" y="300" font-size="13.5" fill="#444">• session</text>
    <text x="190" y="320" font-size="13.5" fill="#444">• session_message (SystemMessage / User / Assistant)</text>
    <text x="190" y="340" font-size="13.5" fill="#444">• event + event_sequence</text>
    <text x="190" y="360" font-size="13.5" fill="#444">• session_inbox + session_claim + resume_counter</text>
    <g transform="translate(1380,330) scale(0.6)">
      <svg xmlns="http://www.w3.org/2000/svg" width="62.4" height="78" viewBox="0 0 48 60">
        <!-- Korpus -->
        <path d="M4 12 V46 C4 50.4 13 54 24 54 C35 54 44 50.4 44 46 V12 Z"
              fill="#C8F0EE" stroke="#3B6EA5" stroke-width="2"/>

        <!-- Deckel -->
        <ellipse cx="24" cy="12" rx="20" ry="8"
                 fill="#C8F0EE" stroke="#3B6EA5" stroke-width="2"/>

        <!-- Optionale Zwischenbögen -->
        <path d="M4 24 C4 28.4 13 32 24 32 C35 32 44 28.4 44 24"
              fill="none" stroke="#3B6EA5" stroke-width="1.5" opacity="0.6"/>
        <path d="M4 36 C4 40.4 13 44 24 44 C35 44 44 40.4 44 36"
              fill="none" stroke="#3B6EA5" stroke-width="1.5" opacity="0.6"/>
      </svg>
    </g>
    <!-- State & Tools -->
    <!--<rect x="590" y="250" width="410" height="132" rx="10" fill="#c8f0ee" stroke="#3b6ea5" stroke-width="1.5"/>-->
    <text x="840" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#333">State &amp; Tools</text>
    <line x1="630" y1="280" x2="1000" y2="280" stroke="#ccc" stroke-width="1"/>
    <text x="640" y="300" font-size="13.5" fill="#444">• tool_output + tool_result_cache</text>
    <text x="640" y="320" font-size="13.5" fill="#444">• pending_approval + question_request + saved_approval</text>
    <text x="640" y="340" font-size="13.5" fill="#444">• instruction_state / entry / blob</text>
    <text x="640" y="360" font-size="13.5" fill="#444">• snapshot + snapshot_file</text>

    <!-- Definitions -->
    <!--<rect x="1040" y="250" width="410" height="132" rx="10" fill="#c8f0ee" stroke="#3b6ea5" stroke-width="1.5"/>-->
    <text x="1290" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#333">Definitions</text>
    <line x1="1080" y1="280" x2="1450" y2="280" stroke="#ccc" stroke-width="1"/>
    <text x="1090" y="300" font-size="13.5" fill="#444">• workflow_definition + workflow_version</text>
    <text x="1090" y="320" font-size="13.5" fill="#444">• agent_definition</text>
    <text x="1090" y="340" font-size="13.5" fill="#444">• mcp_server + credential</text>

    <!-- ================= AGENT LOOP (BOTTOM) ================= -->
    <rect x="155" y="500" width="190" height="72" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="250" y="542" text-anchor="middle" font-size="17" font-weight="600" fill="#123">Agent-Prompt</text>

    <rect x="375" y="500" width="190" height="72" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="470" y="530" text-anchor="middle" font-size="20" font-weight="700" fill="#123">WHILE</text>
    <text x="470" y="552" text-anchor="middle" font-size="11" fill="#456">stepNo &lt;= maxSteps</text>

    <rect x="595" y="500" width="190" height="72" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="690" y="530" text-anchor="middle" font-size="20" font-weight="700" fill="#123">STEP</text>
    <text x="690" y="552" text-anchor="middle" font-size="11" fill="#456">LLM-Call</text>

    <rect x="815" y="500" width="190" height="72" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="910" y="530" text-anchor="middle" font-size="20" font-weight="700" fill="#123">TOOL</text>
    <text x="910" y="552" text-anchor="middle" font-size="11" fill="#456">run Tool</text>

    <rect x="1035" y="500" width="190" height="72" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="1130" y="530" text-anchor="middle" font-size="20" font-weight="700" fill="#123">RESULT</text>
    <text x="1130" y="552" text-anchor="middle" font-size="11" fill="#456">StepResult</text>

    <rect x="1255" y="500" width="190" height="72" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="1350" y="542" text-anchor="middle" font-size="17" font-weight="600" fill="#123">Result</text>

    <line x1="345" y1="536" x2="375" y2="536" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="565" y1="536" x2="595" y2="536" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="785" y1="536" x2="815" y2="536" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1005" y1="536" x2="1035" y2="536" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1225" y1="536" x2="1255" y2="536" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1240" y="526" text-anchor="middle" font-size="10" fill="#666">done</text>

    <!-- Agent self-link -->
    <path d="M 1190 572 V 620 H 470 V 572" fill="none" stroke="#777" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
    <text x="830" y="638" text-anchor="middle" font-size="12" fill="#777">next</text>

    <!-- ================= CROSS LINKS ================= -->
    <!-- Agent-Node starts Agent-Run (blue, through the left DB gap) -->
    <path d="M 910 142 V 180 H 575 V 455 H 250 V 500" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 910 142 V 180 H 575 V 455 H 250 V 500" fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
    <text x="585" y="198" text-anchor="start" font-size="12" font-weight="600" fill="#1a73e8">starts child session</text>

    <!-- Agent-Run result back to Workflow-Run (red, through the right DB gap) -->
    <path d="M 1130 500 V 455 H 1025 V 180 H 1130 V 142" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 1130 500 V 455 H 1025 V 180 H 1130 V 142" fill="none" stroke="#d93025" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
    <text x="1015" y="198" text-anchor="end" font-size="12" font-weight="600" fill="#d93025">NodeResult / childSessionId</text>

    <!-- Shared persistence arrows (dashed) -->
    <line x1="250" y1="142" x2="250" y2="250" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
    <text x="260" y="220" text-anchor="start" font-size="11" fill="#777">session / messages</text>

    <line x1="200" y1="500" x2="200" y2="380" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
    <text x="210" y="440" text-anchor="start" font-size="11" fill="#777">session / messages</text>

    <!-- Shared persistence arrows (dashed) -->
    <line x1="950" y1="142" x2="950" y2="250" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
    <text x="960" y="233" text-anchor="start" font-size="11" fill="#777">node results</text>

    <line x1="900" y1="500" x2="900" y2="380" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
    <text x="910" y="440" text-anchor="start" font-size="11" fill="#777">tool results</text>

    <!-- Footer note -->
    <text x="800" y="680" text-anchor="middle" font-size="11" fill="#666">Note: SystemMessage is a type value in session_message – no separate system_messages table.</text>
  </g>
</svg>
