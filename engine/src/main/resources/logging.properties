# Java Util Logging configuration
# File handler: 2MB max, 10 rotations
handlers=java.util.logging.FileHandler, java.util.logging.ConsoleHandler

# Default log level
.level=FINE

# Console handler
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# File handler
java.util.logging.FileHandler.level=FINE
java.util.logging.FileHandler.pattern=${LOG_DIR:./log}/qoc-engine.%g.log
java.util.logging.FileHandler.limit=2000000
java.util.logging.FileHandler.count=10
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter

# Package-specific levels
de.augmentia.oc.engine.level=FINE
de.augmentia.qoc.workflowrunner.level=FINE