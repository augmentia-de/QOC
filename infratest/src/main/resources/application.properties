quarkus.http.port=8090
quarkus.http.host=127.0.0.1
%test.quarkus.http.test-port=0

# H2 file database for development and production-like runs.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/infratest

# Flyway owns the schema; Hibernate must not update it.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Tests use an isolated in-memory database.
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:infratest;DB_CLOSE_DELAY=-1
%test.quarkus.log.level=INFO

# Cloud Run: stateless container with an ephemeral in-memory database.
# Data is intentionally lost on cold start and on every new revision.
%cloudrun.quarkus.datasource.jdbc.url=jdbc:h2:mem:infratest;DB_CLOSE_DELAY=-1
%cloudrun.quarkus.http.host=0.0.0.0
%cloudrun.quarkus.http.port=${PORT:8080}
