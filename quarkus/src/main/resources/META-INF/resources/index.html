<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCode Engine</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --fg:#e6e6e6; --muted:#9aa0a6; --accent:#4f8cff; --ok:#3fb950; --warn:#d29922; --err:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:.75rem; align-items:center; padding:.6rem 1rem; border-bottom:1px solid var(--border); background:var(--panel); flex-wrap:wrap; }
  header h1 { margin:0; font-size:1.05rem; }
  header select, header button, header input { background:#0b0d12; color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:.3rem .55rem; font-size:.85rem; }
  header button { cursor:pointer; }
  header button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  header button.danger { background:#3a1f24; border-color:#5a1f24; color:#ffb4b4; }
  header .status { margin-left:auto; color:var(--muted); font-size:.8rem; display:flex; align-items:center; gap:.4rem; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .dot.ok { background:var(--ok); }
  .dot.err { background:var(--err); }
  main { display:flex; flex-direction:row; flex:1; overflow:hidden; }
  .chat { flex:1 1 auto; min-width:240px; display:flex; flex-direction:column; border-right:1px solid var(--border); }
  .side-resizer { flex:0 0 6px; width:6px; cursor:col-resize; background:var(--border); }
  .side-resizer:hover { background:var(--accent); }
  .side { flex:0 0 380px; min-width:220px; max-width:60vw; height:90%; max-height:90vh; align-self:flex-start; display:flex; flex-direction:column; overflow:hidden; position:relative; transition:transform .2s ease; background:var(--panel); border-left:1px solid var(--border); }
  .backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:55; backdrop-filter:blur(2px); }
  .backdrop.open { display:block; }
  .chat { display:flex; flex-direction:column; border-right:1px solid var(--border); }
  .messages { flex:1; overflow:auto; padding:1rem; display:flex; flex-direction:column; gap:.75rem; }
  .msg { padding:.6rem .8rem; border-radius:8px; max-width:92%; }
  .msg.user { background:#1f2937; align-self:flex-end; }
  .msg.assistant { background:#111827; border:1px solid var(--border); align-self:flex-start; }
  .msg.tool { background:#0b1a12; border:1px solid #1f3a2a; align-self:flex-start; font-family: ui-monospace, monospace; font-size:.8rem; white-space:pre-wrap; }
  .msg.error { background:#2a1215; border:1px solid #5a1f24; color:#ffb4b4; white-space:pre-wrap; }
  .msg .meta { font-size:.7rem; color:var(--muted); margin-top:.3rem; }
  .msg details { margin-top:.4rem; }
  .msg details summary { cursor:pointer; color:var(--muted); font-size:.75rem; }
  .msg details pre { margin:.4rem 0 0; padding:.5rem; background:#0b0d12; border-radius:4px; overflow:auto; max-height:200px; }
  .inputbar { display:flex; gap:.5rem; padding:.75rem 1rem; border-top:1px solid var(--border); background:var(--panel); }
  .inputbar textarea { flex:1; background:#0b0d12; color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:.5rem; resize:none; height:70px; font-family:inherit; font-size:.9rem; }
  .inputbar button { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:0 .9rem; cursor:pointer; }
  .inputbar button:disabled { opacity:.5; cursor:not-allowed; }
  .side { display:flex; flex-direction:column; overflow:hidden; }
  .panel { display:flex; flex-direction:column; overflow:hidden; min-height:60px; }
  .panel > h2 { flex:0 0 auto; }
  .panel > .filetree, .panel > .viewer, .panel > .logs { flex:1 1 auto; min-height:0; }
  .resizer { flex:0 0 6px; height:6px; cursor:row-resize; background:var(--border); }
  .resizer:hover { background:var(--accent); }
  .section { padding:.75rem 1rem; border-bottom:1px solid var(--border); }
  .section h2 { margin:0 0 .5rem; font-size:.85rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; display:flex; justify-content:space-between; align-items:center; }
  .section h2 button { background:none; border:none; color:var(--muted); cursor:pointer; font-size:.9rem; }
  .filetree { flex:1; overflow:auto; padding:.5rem 1rem; font-family: ui-monospace, monospace; font-size:.85rem; }
  .filetree .entry { cursor:pointer; padding:.15rem 0; display:flex; align-items:center; gap:.3rem; border-radius:4px; }
  .filetree .entry:hover { color:var(--accent); }
  .filetree .entry.selected { background:#1f2937; }
  .filetree .entry .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .filetree .entry .actions { display:flex; gap:.1rem; opacity:0; }
  .filetree .entry:hover .actions, .filetree .entry.selected .actions { opacity:1; }
  .filetree .entry .actions button { background:none; border:none; color:var(--muted); cursor:pointer; padding:0 .15rem; font-size:.8rem; line-height:1; }
  .filetree .entry .actions button:hover { color:var(--accent); }
  .filetree .dir::before { content:"📁 "; }
  .filetree .file::before { content:"📄 "; }
  .filetree .indent { padding-left:1.2rem; }
  .viewer { height:35%; overflow:auto; padding:.75rem 1rem; border-top:1px solid var(--border); }
  .viewer pre { margin:0; white-space:pre-wrap; word-break:break-word; font-family: ui-monospace, monospace; font-size:.85rem; }
  .logs { min-height:0; overflow:auto; padding:.5rem 1rem; font-family: ui-monospace, monospace; font-size:.75rem; color:var(--muted); }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:100; }
  .modal.open { display:flex; }
  .modal .box { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:1.2rem; max-width:480px; width:90%; }
  .modal .box h3 { margin:0 0 .75rem; }
  .modal .box .actions { display:flex; gap:.5rem; justify-content:flex-end; margin-top:1rem; }
  .modal .box button { padding:.4rem .8rem; border-radius:6px; border:1px solid var(--border); background:#0b0d12; color:var(--fg); cursor:pointer; }
  .modal .box button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .modal .box button.danger { background:#3a1f24; border-color:#5a1f24; color:#ffb4b4; }
  .md h1,.md h2,.md h3 { margin:.6rem 0 .3rem; }
  .md h1 { font-size:1.2rem; } .md h2 { font-size:1.05rem; } .md h3 { font-size:.95rem; }
  .md p { margin:.4rem 0; }
  .md ul { margin:.4rem 0; padding-left:1.4rem; }
  .md code { background:#0b0d12; padding:.1rem .3rem; border-radius:3px; font-family:ui-monospace,monospace; font-size:.85em; }
  .md pre { background:#0b0d12; padding:.6rem; border-radius:6px; overflow:auto; margin:.4rem 0; position:relative; }
  .md pre code { background:none; padding:0; }
  .md pre .copy { position:absolute; top:.3rem; right:.3rem; background:#1f2937; border:1px solid var(--border); color:var(--muted); border-radius:4px; padding:.15rem .4rem; font-size:.7rem; cursor:pointer; }
  .md a { color:var(--accent); }
  .cmd-hint { font-size:.75rem; color:var(--muted); padding:.25rem 1rem; border-top:1px solid var(--border); }

  .close-side { display:none; position:absolute; top:.4rem; right:.6rem; background:none; border:none; color:var(--muted); font-size:1.2rem; cursor:pointer; }
  .toggle-side { display:none; position:fixed; right:0; top:50%; transform:translateY(-50%); z-index:65;
    background:var(--panel); color:var(--fg); border:1px solid var(--border); border-right:none;
    border-radius:6px 0 0 6px; padding:.7rem .25rem; cursor:pointer; font-size:1rem; line-height:1; }
  .file-actions { display:flex; gap:.15rem; align-items:center; }
  #agent { max-width: 300px; }
  /* Header-Stabilität: verhindert Layout-Sprünge durch lange Session-/Agent-Namen */
  header { flex-wrap: wrap; }
  #sessions { min-width: 140px; max-width: 40vw; flex: 0 1 auto; }
  #sessionTitle { max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; color: var(--muted); font-size: .85rem; }
  #agent { min-width: 120px; }
  header .status { margin-left: auto; white-space: nowrap; flex: 0 0 auto; }
  header button, header select, header input, header label { flex: 0 0 auto; }
  .messages { overflow-y: auto; overscroll-behavior: contain; }
  .logs { overscroll-behavior: contain; }

  /* Media-Queries zuletzt, damit sie die Basisregeln überschreiben */
  @media (max-width: 768px) {
    main { overflow: hidden; height: 100%; }
    .chat { min-width: 0; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .messages { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .inputbar { flex: 0 0 auto; }
    .side-resizer { display:none; }
    .side { position:fixed; top:0; right:0; height:90vh; width:86vw; max-width:360px; transform:translateX(100%); z-index:60; box-shadow:-2px 0 12px rgba(0,0,0,.5); background: var(--panel); }
    .side.open { transform:translateX(0); }
    .side .close-side { display:block; }
    .toggle-side { display:block !important; z-index: 70; }
    .filetree .entry .actions { opacity:1; }
  }
  @media (max-width: 480px) {
    header h1 { font-size: .95rem; }
    #sessions { max-width: 55vw; }
    #sessionTitle { max-width: 45vw; }
    #agent { max-width: 40vw; min-width: 90px; }
  }
</style>
</head>
<body>
<header>
  <h1>QOC Engine</h1>
  <select id="sessions"></select>
  <span id="sessionTitle" style="color:var(--muted);font-size:.85rem"></span>
  <label>Agent <select id="agent"></select></label>
  <!--label>Model <select id="model"></select></label>
  <label>Provider <select id="provider"></select></label-->
  <button id="newSession" class="primary">+ Neue Session</button>
  <button id="deleteSession" class="danger">Löschen</button>
  <button id="interrupt" class="danger">Interrupt</button>
  <button id="compact">Compact</button>
  <button id="loginBtn">Login</button>
  <span id="authStatus" style="color:var(--muted);font-size:.8rem"></span>
  <button id="reloadConfig">Reload Config</button>
  <button id="a2aAgents">A2A</button>
  <button id="revert">Revert</button>
  <button id="fork">Fork</button>
  <label><input type="checkbox" id="showDetails"> Details</label>
  <span class="status"><span class="dot" id="healthDot"></span><span id="status">bereit</span></span>
</header>
<main>
  <div class="chat">
    <div class="messages" id="messages"></div>
    <div class="cmd-hint">Slash-Commands: /compact, /revert, /fork, /interrupt, /title, /new. Strg+Enter sendet.</div>
    <div class="inputbar">
      <textarea id="input" placeholder="Prompt eingeben…"></textarea>
      <button id="send">Senden</button>
    </div>
  </div>
  <div class="side-resizer" id="sideResizer"></div>
  <aside class="side" id="side">
    <button class="close-side" id="closeSide" title="Schließen">×</button>
    <section class="section panel" id="panelFiles">
      <h2>Arbeitsverzeichnis
        <span class="file-actions">
          <button id="uploadFile" title="Dateien hochladen">⤒</button>
          <button id="uploadDir" title="Ordner hochladen">⇪</button>
          <button id="newFile" title="Neue Datei">+</button>
          <button id="refreshFiles" title="Aktualisieren">↻</button>
        </span>
      </h2>
      <div class="filetree" id="filetree"></div>
      <input type="file" id="uploadFileInput" multiple hidden>
      <input type="file" id="uploadDirInput" webkitdirectory multiple hidden>
    </section>
    <div class="resizer" data-i="0"></div>
    <section class="section panel" id="panelViewer">
      <h2>Datei <span id="currentFileName" style="color:var(--muted);font-weight:normal;text-transform:none;letter-spacing:0"></span>
        <span class="file-actions">
          <button id="editFileBtn" title="Datei bearbeiten (max. 10000 Zeichen)" style="display:none">✎</button>
        </span>
      </h2>
      <pre class="viewer" id="viewer">Datei auswählen…</pre>
      <textarea id="fileEditor" style="display:none;width:100%;min-height:200px;font-family:monospace;font-size:.85rem;background:#0b0d12;color:var(--fg);border:1px solid #2a3140;border-radius:6px;padding:.5rem;resize:vertical"></textarea>
      <div id="editorActions" style="display:none;gap:.5rem;margin-top:.5rem">
        <button id="saveFileBtn" class="primary">Speichern</button>
        <button id="cancelEditBtn">Abbrechen</button>
        <span id="editorStatus" style="color:var(--muted);font-size:.8rem"></span>

    <div class="resizer" data-i="1"></div>
    <section class="section panel" id="panelLogs">
      <h2>Ereignisse</h2>
      <div class="logs" id="logs"></div>
    </section>
  </aside>
</main>
<button class="toggle-side" id="toggleSide" title="Dateien anzeigen" aria-label="Dateien anzeigen">‹</button>
<div class="backdrop" id="backdrop"></div>

<div class="modal" id="permModal">
  <div class="box">
    <h3>Berechtigung erforderlich</h3>
    <p id="permContext"></p>
    <div class="actions">
      <button id="permReject">Ablehnen</button>
      <button id="permOnce">Einmal</button>
      <button id="permAlways" class="primary">Immer erlauben</button>
    </div>
  </div>
</div>

<div class="modal" id="questionModal">
  <div class="box">
    <h3>Frage</h3>
    <div id="questionText"></div>
    <div id="questionOptions" style="display:flex;flex-direction:column;gap:.6rem;margin:.6rem 0"></div>
    <textarea id="questionAnswer" rows="3" placeholder="Antwort…" style="width:100%"></textarea>
    <div class="actions">
      <button id="questionSend" class="primary">Senden</button>
    </div>

</div>

<div class="modal" id="a2aModal">

    <h3>A2A-Agents</h3>
    <div id="a2aList" style="max-height:60vh;overflow:auto;font-size:.85rem">Lade…</div>
    <div class="actions">
      <button id="a2aRefresh">Aktualisieren</button>
      <button id="a2aClose" class="primary">Schließen</button>
    </div>
  </div>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const status = document.getElementById('status');
const healthDot = document.getElementById('healthDot');
const filetree = document.getElementById('filetree');
const viewer = document.getElementById('viewer');
const currentFileName = document.getElementById('currentFileName');
const logs = document.getElementById('logs');

// --- OIDC token handling (browser login against Keycloak) ---
const AUTH = {
  tokenUrl: localStorage.getItem('qoc.tokenUrl') || 'http://localhost:8180/realms/qoc/protocol/openid-connect/token',
  clientId: localStorage.getItem('qoc.clientId') || 'qoc-ui',
  token: localStorage.getItem('qoc.accessToken') || '',
  refresh: localStorage.getItem('qoc.refreshToken') || ''
};
function authHeaders(headers) {
  const h = new Headers(headers || {});
  if (AUTH.token) h.set('Authorization', 'Bearer ' + AUTH.token);
  return h;
}
const nativeFetch = window.fetch.bind(window);
window.fetch = (input, init) => {
  const opts = Object.assign({}, init || {});
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  if (url.startsWith('/api/') || url.startsWith(location.origin + '/api/')) {
    opts.headers = authHeaders(opts.headers);
  }
  return nativeFetch(input, opts).then(res => {
    if (res.status === 401 && AUTH.token) {
      AUTH.token = ''; AUTH.refresh = '';
      localStorage.removeItem('qoc.accessToken');
      localStorage.removeItem('qoc.refreshToken');
      updateAuthStatus();
    }
    return res;
  });
};
function updateAuthStatus() {
  const el = document.getElementById('authStatus');
  if (!el) return;
  el.textContent = AUTH.token ? 'angemeldet' : 'nicht angemeldet';
  el.style.color = AUTH.token ? '#6ee7b7' : 'var(--muted)';
}
async function login() {
  const username = prompt('Benutzername (Keycloak):');
  if (!username) return;
  const password = prompt('Passwort:');
  if (!password) return;
  try {
    const body = new URLSearchParams({
      grant_type: 'password', client_id: AUTH.clientId, username, password
    });
    const res = await nativeFetch(AUTH.tokenUrl, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.error || ('HTTP ' + res.status));
    AUTH.token = data.access_token || '';
    AUTH.refresh = data.refresh_token || '';
    localStorage.setItem('qoc.accessToken', AUTH.token);
    localStorage.setItem('qoc.refreshToken', AUTH.refresh);
    updateAuthStatus();
    if (typeof loadSelectors === 'function') await loadSelectors();
    if (typeof loadSessions === 'function') await loadSessions();
    if (typeof loadFiles === 'function') await loadFiles(currentDir);
  } catch (e) {
    alert('Login fehlgeschlagen: ' + e.message);
  }
}

let sessionId = null;
let es = null;
let currentAssistant = null;
let currentFile = null;
let currentFileContent = '';
let currentDir = '.';
let pendingPermission = null;
let resizersBound = false;
let isMobileLayout = window.innerWidth <= 768;
const sessionsSel = document.getElementById('sessions');
const sessionTitle = document.getElementById('sessionTitle');
const showDetails = document.getElementById('showDetails');
let permPoll = null;
let questionPoll = null;
let pendingQuestion = null;
const MAX_EVENTS = 100;
const MAX_FILE_CHARS = 20000;

function logEvent(text) {
  const d = document.createElement('div');
  d.textContent = text;
  logs.appendChild(d);
  while (logs.childElementCount > MAX_EVENTS) logs.removeChild(logs.firstElementChild);
  logs.scrollTop = logs.scrollHeight;
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = role === 'assistant' ? renderMarkdown(text) : escapeHtml(text);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderMarkdown(text) {
  if (!text) return '';
  // code blocks
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const esc = escapeHtml(code.replace(/\n$/,''));
    return '<pre><code class="lang-'+lang+'">' + esc + '</code><button class="copy" onclick="copyCode(this)">Kopieren</button></pre>';
  });
  // headings
  text = text.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.*)$/gm, '<h1>$1</h1>');
  // bold + italic
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // links
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // lists
  text = text.replace(/(?:^|\n)((?:- .+\n?)+)/g, (m) => {
    const items = m.trim().split('\n').map(l => '<li>' + l.replace(/^- /,'') + '</li>').join('');
    return '<ul>' + items + '</ul>';
  });
  // paragraphs
  text = text.split(/\n\n+/).map(p => p.trim() ? '<p>' + p.replace(/\n/g,'<br>') + '</p>' : '').join('');
  return text;
}

function copyCode(btn) {
  const code = btn.parentElement.querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(()=>{ btn.textContent='Kopiert'; setTimeout(()=>btn.textContent='Kopieren',1500); });
}

function initResizers() {
  const side = document.querySelector('.side');
  const panels = [document.getElementById('panelFiles'), document.getElementById('panelViewer'), document.getElementById('panelLogs')];
  const resizers = side.querySelectorAll('.resizer');
  if (window.innerWidth <= 768) {
    // Auf Mobilgeräten: flexible Panels statt fester Resizer-Höhen
    panels.forEach(p => { p.style.flex = '1 1 auto'; p.style.height = ''; });
    resizers.forEach(r => { r.style.display = 'none'; });
    return;
  }
  const total = side.clientHeight || 600;
  const resizerTotal = Array.from(resizers).reduce((sum, r) => sum + r.offsetHeight, 0);
  const usable = Math.max(180, total - resizerTotal);
  const init = [Math.round(usable*0.4), Math.round(usable*0.35), usable - Math.round(usable*0.4) - Math.round(usable*0.35)];
  panels.forEach((p,i) => { p.style.flex = '0 0 auto'; p.style.height = init[i] + 'px'; });
  resizers.forEach(r => { r.style.display = ''; });
  if (resizersBound) return;
  resizersBound = true;
  resizers.forEach((r, i) => {
    r.addEventListener('mousedown', (e) => {
      const top = panels[i], bot = panels[i+1];
      const startY = e.clientY;
      const topH = top.offsetHeight, botH = bot.offsetHeight;
      const onMove = (e2) => {
        const delta = e2.clientY - startY;
        const nt = Math.max(60, topH + delta);
        const nb = Math.max(60, botH - delta);
        top.style.height = nt + 'px';
        bot.style.height = nb + 'px';
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.body.style.cursor = 'row-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
  });
}


function initSideResizer() {
  const resizer = document.getElementById('sideResizer');
  const side = document.getElementById('side');
  if (!resizer || !side) return;
  resizer.addEventListener('mousedown', (e) => {
    if (window.innerWidth <= 768) return;
    const startX = e.clientX;
    const startW = side.offsetWidth;
    const onMove = (e2) => {
      const delta = startX - e2.clientX;
      const nw = Math.min(Math.max(220, startW + delta), window.innerWidth * 0.6);
      side.style.flexBasis = nw + 'px';
      side.style.width = nw + 'px';
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
}

function openSide() {
  const side = document.getElementById('side');
  const bd = document.getElementById('backdrop');
  const toggle = document.getElementById('toggleSide');
  if (side) side.classList.add('open');
  if (bd) bd.classList.add('open');
  if (toggle) {
    toggle.textContent = '›';
    toggle.title = 'Dateien ausblenden';
    toggle.setAttribute('aria-label', 'Dateien ausblenden');
    // Panel überdeckt den Button im geöffneten Zustand → ausblenden
    toggle.style.setProperty('display', 'none', 'important');
  }
}
function closeSide() {
  const side = document.getElementById('side');
  const bd = document.getElementById('backdrop');
  const toggle = document.getElementById('toggleSide');
  if (side) side.classList.remove('open');
  if (bd) bd.classList.remove('open');
  if (toggle) {
    toggle.textContent = '‹';
    toggle.title = 'Dateien anzeigen';
    toggle.setAttribute('aria-label', 'Dateien anzeigen');
    toggle.style.removeProperty('display');
  }
}

function initMobileSide() {
  const bd = document.getElementById('backdrop');
  const closeBtn = document.getElementById('closeSide');
  const toggle = document.getElementById('toggleSide');
  if (bd) bd.addEventListener('click', closeSide);
  if (closeBtn) closeBtn.addEventListener('click', closeSide);
  if (toggle) toggle.addEventListener('click', () => {
    const side = document.getElementById('side');
    if (side && side.classList.contains('open')) closeSide(); else openSide();
  });
  // Touch right edge to reveal
  let startX = 0;
  document.addEventListener('touchstart', (e) => {
    if (window.innerWidth > 768) return;
    startX = e.touches[0].clientX;
  }, {passive:true});
  document.addEventListener('touchmove', (e) => {
    if (window.innerWidth > 768) return;
    const x = e.touches[0].clientX;
    if (startX >= window.innerWidth - 24 && startX - x > 40) {
      openSide();
      startX = 0;
    }
  }, {passive:true});
}

async function switchSession(id) {

function connectSSE() {
  if (es) es.close();
  es = new EventSource('/api/event?session=' + encodeURIComponent(sessionId) + '&live=true');
  es.onmessage = (e) => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    if (ev._type) {
      switch (ev._type) {
        case 'TextStarted':
          if (!showDetails.checked) return;
          currentAssistant = addMessage('assistant', '');
          break;
        case 'TextDelta':
          if (!showDetails.checked || !currentAssistant) return;
          currentAssistant.textContent += ev.text; currentAssistant.innerHTML = renderMarkdown(currentAssistant.textContent); messages.scrollTop = messages.scrollHeight;
          break;
        case 'TextEnded':
          if (!showDetails.checked) { currentAssistant = null; return; }
          if (currentAssistant && !currentAssistant.textContent) currentAssistant.innerHTML = renderMarkdown(ev.text);
          currentAssistant = null;
          break;
        case 'ToolCallRequested':
          if (!showDetails.checked) return;
          addMessage('tool', '🔧 ' + ev.name + '(' + JSON.stringify(ev.input) + ')');
          break;
        case 'ToolFailed':
          addMessage('error', '⚠ ' + ev.message);
          break;
        case 'Finished':
          logEvent('Fertig: ' + ev.reason + ' (' + (ev.usage?ev.usage.input:0) + '/' + (ev.usage?ev.usage.output:0) + ')');
          loadFiles(currentDir);
          break;
        case 'ProviderFailed':
          addMessage('error', 'Provider-Fehler: ' + ev.message);
          break;
      }
    } else if (ev.type) {
      logEvent(ev.type + (ev.data && ev.data.text ? ': ' + ev.data.text.slice(0,80) : ''));
    }
  };
  es.onerror = () => { status.textContent = 'SSE getrennt'; };
}

async function send() {
  const text = input.value.trim();
  if (!text || !sessionId) return;
  // slash commands
  if (text.startsWith('/')) {
    handleCommand(text);
    input.value = '';
    return;
  }
  addMessage('user', text);
  input.value = '';
  sendBtn.disabled = true;
  status.textContent = 'Denke…';
  if (permPoll) clearInterval(permPoll);
  permPoll = setInterval(checkPermissions, 700);
  if (questionPoll) clearInterval(questionPoll);
  questionPoll = setInterval(checkQuestions, 700);
  currentAssistant = null;
  try {
    const res = await fetch('/api/session/' + sessionId + '/prompt', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})
    });
    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      addMessage('error', 'Fehler: ' + (err.message || err.error || res.status));
    } else {
      const data = await res.json();
      if (data.text && !currentAssistant) addMessage('assistant', data.text);
    }
  } catch (e) {
    addMessage('error', 'Netzwerkfehler: ' + e.message);
  } finally {
    if (permPoll) { clearInterval(permPoll); permPoll = null; }
    if (questionPoll) { clearInterval(questionPoll); questionPoll = null; }
    sendBtn.disabled = false;
    status.textContent = 'bereit';
    loadSessions();
    loadFiles(currentDir);
  }
}

async function handleCommand(cmd) {
  const parts = cmd.trim().split(/\s+/);
  const name = parts[0].slice(1);
  const args = parts.slice(1).join(' ');
  addMessage('user', cmd);
  switch (name) {
    case 'new':
      await newSession();
      break;
    case 'interrupt':
      await fetch('/api/session/' + sessionId + '/interrupt', {method:'POST'});
      logEvent('Interrupt gesendet');
      break;
    case 'title':
      try {
        const res = await fetch('/api/session/' + sessionId + '/title', {method:'POST'});
        const data = await res.json();
        logEvent('Titel: ' + data.title);
      } catch (e) { logEvent('Fehler: ' + e.message); }
      break;
    case 'compact':
      await compactNow();
      break;
    case 'revert':
      await revertTurn();
      break;
    case 'fork':
      await forkSession();
      break;
    default:
      // treat as prompt
      input.value = cmd;
      await send();
  }
}

function fill(id, items) {
  const sel = document.getElementById(id);
  sel.innerHTML = '';
  if (!items.length) { const o=document.createElement('option'); o.textContent='(keine)'; sel.appendChild(o); return; }
  items.forEach(it => { const o=document.createElement('option'); o.value=it.value; o.textContent=it.label; sel.appendChild(o); });
}

function joinPath(dir, name) {
  if (!name) return dir || '.';
  if (!dir || dir === '.') return name;
  return dir.replace(/\/+$/, '') + '/' + (name.startsWith('/') ? name.slice(1) : name);
}

function parentPath(path) {
  if (!path || path === '.' || path === '/') return '.';
  const norm = path.replace(/\/+$/, '');
  const idx = norm.lastIndexOf('/');
  if (idx < 0) return '.';
  if (idx === 0) return '/';
  return norm.slice(0, idx);
}

function fileName(path) {
  if (!path) return '';
  const norm = path.replace(/\/+$/, '');
  const idx = norm.lastIndexOf('/');
  return idx < 0 ? norm : norm.slice(idx + 1);
}

async function loadFiles(path) {
  const target = path || '.';
  try {
    const res = await fetch('/api/files?path=' + encodeURIComponent(target));
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.error || ('HTTP ' + res.status));
    filetree.innerHTML = '';
    currentDir = target;
    if (target !== '.' && target !== '/') {
      const up = document.createElement('div');
      up.className = 'entry dir';
      const upName = document.createElement('span');
      upName.className = 'name';
      upName.textContent = '..';
      upName.onclick = () => loadFiles(parentPath(target));
      up.appendChild(upName);
      filetree.appendChild(up);
    }
    (data.data||[]).forEach(e => {
      const row = document.createElement('div');
      row.className = 'entry ' + (e.directory ? 'dir' : 'file');
      row.dataset.path = e.relative;
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = e.name;
      name.onclick = () => e.directory ? loadFiles(e.relative) : viewFile(e.relative);
      row.appendChild(name);

      const actions = document.createElement('span');
      actions.className = 'actions';
      const dl = document.createElement('button');
      dl.textContent = '⬇';
      dl.title = e.directory ? 'Ordner als ZIP herunterladen' : 'Datei herunterladen';
      dl.onclick = (ev) => { ev.stopPropagation(); e.directory ? downloadDirectory(e.relative) : downloadFile(e.relative); };
      const del = document.createElement('button');
      del.textContent = '🗑';
      del.title = e.directory ? 'Ordner löschen' : 'Datei löschen';
      del.onclick = (ev) => { ev.stopPropagation(); deletePath(e.relative, e.directory); };
      actions.appendChild(dl);
      actions.appendChild(del);
      row.appendChild(actions);

      if (currentFile === e.relative) row.classList.add('selected');
      filetree.appendChild(row);
    });
    if (!(data.data||[]).length) {
      filetree.appendChild(document.createTextNode('(leer)'));
    }
  } catch (e) { filetree.textContent = 'Fehler: ' + e.message; }
}

async function viewFile(path) {
  try {
    const res = await fetch('/api/file?path=' + encodeURIComponent(path));
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.error || ('HTTP ' + res.status));
    const fullContent = data.data ? String(data.data.content || '') : JSON.stringify(data);
    let content = fullContent;
    if (content.length > MAX_FILE_CHARS) content = content.slice(0, MAX_FILE_CHARS);
    if (data.data && data.data.truncated) {
      const total = Number(data.data.totalChars || 0).toLocaleString('de-DE');
      content += '\n\n… Anzeige auf ' + MAX_FILE_CHARS.toLocaleString('de-DE')
              + ' Zeichen gekürzt (Datei: ' + total + ' Zeichen).';
    }
    viewer.textContent = content;
    currentFile = path;
    currentFileContent = fullContent;
    currentFileName.textContent = fileName(path);
    const editBtn = document.getElementById('editFileBtn');
    editBtn.style.display = isEditable(path, fullContent) ? 'inline-block' : 'none';
    Array.from(filetree.querySelectorAll('.entry')).forEach(row => {
      row.classList.toggle('selected', row.dataset.path === path);
    });
  } catch (e) {
    viewer.textContent = 'Fehler: ' + e.message;
    currentFile = null;
    currentFileName.textContent = '';
    document.getElementById('editFileBtn').style.display = 'none';
  }
}

const EDITABLE_EXT = new Set(['txt','md','json','yaml','yml','xml','html','css','js','ts','java','py','sh','bash','properties','conf','cfg','ini','toml','csv','log','sql','kt','go','rs','c','cpp','h','hpp']);
let editingFile = false;
function isEditable(path, content) {
  if (!path || content.length > 10000) return false;
  const lower = path.toLowerCase();
  const dot = lower.lastIndexOf('.');
  const ext = dot >= 0 ? lower.substring(dot + 1) : '';
  if (!ext) return true; // files without extension editable
  return EDITABLE_EXT.has(ext);
}
function enterEditMode(content) {
  editingFile = true;
  viewer.style.display = 'none';
  const ed = document.getElementById('fileEditor');
  ed.value = content;
  ed.style.display = 'block';
  document.getElementById('editorActions').style.display = 'flex';
  document.getElementById('editorStatus').textContent = '';
}
function exitEditMode() {
  editingFile = false;
  document.getElementById('fileEditor').style.display = 'none';
  document.getElementById('editorActions').style.display = 'none';
  viewer.style.display = 'block';
}
async function saveFile() {

  if (content.length > 10000) { alert('Zu groß (max. 10000 Zeichen)'); return; }
  try {
    const res = await fetch('/api/file', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path: currentFile, content})});
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || data.error || ('HTTP ' + res.status));
    document.getElementById('editorStatus').textContent = 'Gespeichert.';
    await viewFile(currentFile);

async function createFile() {

    const res = await fetch('/api/file', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path: joinPath(currentDir, name), content})});
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || data.error || ('HTTP ' + res.status));
    await loadFiles(currentDir);
  } catch (e) { alert('Fehler: ' + e.message); }

function triggerDownload(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name || 'download';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

async function downloadFile(path) {
  try {
    const res = await fetch('/api/file/download?path=' + encodeURIComponent(path));
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || err.error || ('HTTP ' + res.status));
    }
    triggerDownload(await res.blob(), fileName(path));
  } catch (e) { alert('Download fehlgeschlagen: ' + e.message); }
}

async function downloadDirectory(path) {
  try {
    const res = await fetch('/api/dir/download?path=' + encodeURIComponent(path));
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || err.error || ('HTTP ' + res.status));
    }
    triggerDownload(await res.blob(), fileName(path) + '.zip');
  } catch (e) { alert('Download fehlgeschlagen: ' + e.message); }

async function deletePath(path, isDir) {
  const label = (isDir ? 'Ordner (rekursiv)' : 'Datei') + ': ' + path;
  if (!confirm('Löschen?\n\n' + label)) return;
  try {
    const res = await fetch('/api/file?path=' + encodeURIComponent(path), {method:'DELETE'});
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || data.error || ('HTTP ' + res.status));
    if (currentFile === path || (isDir && currentFile && currentFile.startsWith(path + '/'))) {
      currentFile = null;
      currentFileName.textContent = '';
      viewer.textContent = 'Datei auswählen…';
    }
    await loadFiles(currentDir);
  } catch (e) { alert('Löschen fehlgeschlagen: ' + e.message); }
}

async function uploadFiles(files) {
  if (!files || !files.length) return;
  let failed = 0;
  for (const file of files) {
    const rel = file.webkitRelativePath || file.name;
    const target = joinPath(currentDir, rel);
    try {
      const res = await fetch('/api/file/upload?path=' + encodeURIComponent(target), {
        method:'POST', headers:{'Content-Type':'application/octet-stream'}, body:file
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || err.error || ('HTTP ' + res.status));
      }
    } catch (e) {
      failed++;
      logEvent('Upload fehlgeschlagen (' + target + '): ' + e.message);
    }
  }
  await loadFiles(currentDir);
  if (failed) alert(failed + ' Datei(en) konnten nicht hochgeladen werden.');
}

async function replyPermission(reply) {
  if (!pendingPermission || !sessionId) return;
  try {
    await fetch('/api/session/' + sessionId + '/permission/' + pendingPermission.id + '/reply', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({reply})
    });
  } catch (e) { logEvent('Permission reply error: ' + e.message); }
  document.getElementById('permModal').classList.remove('open');
  pendingPermission = null;
}

async function checkPermissions() {
  if (!sessionId) return;
  try {
    const res = await fetch('/api/session/' + sessionId + '/permission');
    const data = await res.json();
    const list = data.data || [];
    if (list.length && !pendingPermission) {
      pendingPermission = list[0];
      const permMsg = (pendingPermission.message && pendingPermission.message.trim())
        ? pendingPermission.message
        : (pendingPermission.action + ' — ' + (pendingPermission.resources||[]).join(', '));
      document.getElementById('permContext').textContent =
        permMsg.length > 750 ? permMsg.substring(0, 750) + '…' : permMsg;
      document.getElementById('permModal').classList.add('open');
    }
  } catch (e) { /* ignore */ }
}

async function checkQuestions() {
  if (!sessionId || pendingQuestion) return;
  try {
    const res = await fetch('/api/session/' + sessionId + '/question');
    const data = await res.json();
    if (data.id && data.questions && data.questions.length) {
      pendingQuestion = data;
      renderQuestion(data);
      document.getElementById('questionModal').classList.add('open');
    }
  } catch (e) { /* ignore */ }
}

function renderQuestion(data) {
  const container = document.getElementById('questionText');
  container.innerHTML = '';
  const options = document.getElementById('questionOptions');
  options.innerHTML = '';
  data.selections = new Map();
  data.questions.forEach((q, index) => {
    const block = document.createElement('div');
    const header = document.createElement('div');
    header.innerHTML = '<strong></strong>';
    header.querySelector('strong').textContent = q.header || ('Frage ' + (index + 1));
    const body = document.createElement('div');
    body.textContent = q.question;
    block.appendChild(header);
    block.appendChild(body);
    const selected = new Set();
    data.selections.set(index, selected);
    (q.options || []).forEach(opt => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = opt.label;
      button.title = opt.description || '';
      button.style.marginRight = '.3rem';
      button.onclick = () => {
        if (q.multiple) {
          if (selected.has(opt.label)) { selected.delete(opt.label); button.classList.remove('primary'); }
          else { selected.add(opt.label); button.classList.add('primary'); }
        } else {
          selected.clear();
          selected.add(opt.label);
          Array.from(block.querySelectorAll('button')).forEach(b => b.classList.remove('primary'));
          button.classList.add('primary');
        }
      };
      block.appendChild(button);
    });
    options.appendChild(block);
  });
  document.getElementById('questionAnswer').value = '';
}

async function replyPendingQuestion() {
  if (!pendingQuestion) return;
  const selected = [];
  pendingQuestion.selections.forEach(set => set.forEach(value => selected.push(value)));
  const text = document.getElementById('questionAnswer').value;
  try {
    await fetch('/api/session/' + sessionId + '/question/' + encodeURIComponent(pendingQuestion.id) + '/reply', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ selected, text })
    });
  } catch (e) {
    logEvent('Frage-Antwort fehlgeschlagen: ' + e.message);
  }
  document.getElementById('questionModal').classList.remove('open');
  pendingQuestion = null;
}

async function loadA2AAgents(refresh) {
  const list = document.getElementById('a2aList');
  list.textContent = 'Lade…';
  try {
    const res = await fetch('/api/a2a/agents' + (refresh ? '?refresh=true' : ''));
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || ('HTTP ' + res.status));
    }
    const data = await res.json();
    list.innerHTML = '';
    const agents = data.data || [];
    if (!agents.length) {
      list.textContent = 'Keine A2A-Agents konfiguriert (engine.a2a.urls / engine.a2a.endpoints).';
      return;
    }
    agents.forEach(a => list.appendChild(renderA2AAgent(a)));
  } catch (e) {
    list.textContent = 'Fehler: ' + e.message;
  }
}

function renderA2AAgent(a) {
  const box = document.createElement('div');
  box.style.cssText = 'border:1px solid var(--border);border-radius:8px;padding:.6rem;margin-bottom:.6rem';
  const head = document.createElement('div');
  head.style.cssText = 'display:flex;gap:.5rem;align-items:center;flex-wrap:wrap';
  const title = document.createElement('strong');
  title.textContent = a.name || a.id || a.url;
  const badge = document.createElement('span');
  badge.textContent = a.status;
  badge.style.cssText = 'font-size:.7rem;padding:.1rem .4rem;border-radius:999px;border:1px solid var(--border);color:' +
    (a.status === 'ok' ? 'var(--ok)' : a.status === 'error' ? 'var(--err)' : 'var(--muted)');
  head.appendChild(title);
  head.appendChild(badge);
  if (a.cached) {
    const cached = document.createElement('span');
    cached.textContent = 'cache';
    cached.style.cssText = 'font-size:.7rem;color:var(--muted)';
    head.appendChild(cached);
  }
  box.appendChild(head);

  const meta = document.createElement('div');
  meta.style.cssText = 'font-size:.75rem;color:var(--muted);margin-top:.25rem;word-break:break-all';
  meta.textContent = [a.url, a.tool ? '→ ' + a.tool : null].filter(Boolean).join(' ');
  box.appendChild(meta);

  const version = [a.version ? 'v' + a.version : null,
    a.protocolVersion ? 'protocol ' + a.protocolVersion : null].filter(Boolean).join(' · ');
  if (version) {
    const v = document.createElement('div');
    v.style.cssText = 'font-size:.75rem;color:var(--muted)';
    v.textContent = version;
    box.appendChild(v);
  }
  if (a.description) {
    const d = document.createElement('div');
    d.style.cssText = 'font-size:.8rem;margin-top:.3rem';
    d.textContent = a.description;
    box.appendChild(d);
  }
  if (a.skills && a.skills.length) {
    const ul = document.createElement('ul');
    ul.style.cssText = 'margin:.3rem 0 0;padding-left:1.2rem;font-size:.78rem';
    a.skills.forEach(s => {
      const li = document.createElement('li');
      li.textContent = s.name || s.id || '';
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }
  if (a.error) {
    const err = document.createElement('div');
    err.style.cssText = 'font-size:.78rem;color:var(--err);margin-top:.3rem';
    err.textContent = a.error;
    box.appendChild(err);
  }
  return box;
}

  document.getElementById('a2aModal').classList.add('open');
