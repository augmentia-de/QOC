<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/config.js"></script>
    <title>QOC Core</title>
    <script type="module" crossorigin src="/core/assets/index-B2b7pMdU.js"></script>
    <link rel="stylesheet" crossorigin href="/core/assets/index-BVgSsFon.css">
  </head>
  <body>
    <header>
      <h1>QOC Core</h1>
      <button id="loginBtn">Login</button>
      <button id="questionsBtn" title="Ausstehende Fragen" style="position:relative">❓ <span id="questionsBadge" style="display:none;position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;border-radius:10px;padding:0 5px;font-size:0.7rem;min-width:16px;text-align:center">0</span></button>
      <button id="hardCancelBtn" title="Lauf abbrechen" disabled>✕</button>
      <select id="sessions" title="Session"></select>
      <button id="newSessionBtn">Neue Session</button>
      <button id="deleteSessionBtn">Delete</button>
      <select id="agent" title="Agent" style="max-width:30vw"></select>
      <label class="details-toggle"><input type="checkbox" id="showDetails"> Details</label>
      <span id="status">ready</span>
      <a href="/" style="color:var(--accent);text-decoration:none;margin-left:1rem">Full UI</a>
    </header>
    <main>
      <div class="chat">
        <div class="messages" id="messages"></div>
        <div class="inputbar" id="inputWrap">
          <textarea id="input" rows="3" placeholder="Prompt eingeben…"></textarea>
          <button id="send">Send</button>
        </div>
      </div>
      <aside class="side">
        <section class="section panel" id="panelQuestions" style="display:none">
          <h2>Ausstehende Fragen <button id="refreshQuestions" style="float:right;background:none;border:none;color:var(--muted);cursor:pointer">↻</button></h2>
          <div id="questionsList"></div>
        </section>
        <section class="section panel" id="panelTasks">
          <h2>Subagents</h2>
          <div id="tasks"></div>
        </section>
        <section class="section panel" id="panelEvents">
          <h2>Ereignisse</h2>
          <div class="logs" id="logs"></div>
        </section>
      </aside>
    </main>
    <div class="modal" id="permModal">
      <div class="box">
        <h3>Permission required</h3>
        <p id="permContext"></p>
        <div class="actions">
          <button id="permReject">Ablehnen</button>
          <button id="permOnce">Einmal</button>
          <button id="permAlways" class="primary">Immer erlauben</button>
        </div>
      </div>
    </div>
    <div class="modal" id="questionModal">
      <div class="box">
        <h3>Frage</h3>
        <div id="questionText"></div>
        <div id="questionOptions" style="display:flex;flex-direction:column;gap:.6rem;margin:.6rem 0"></div>
        <textarea id="questionAnswer" rows="3" placeholder="Antwort…" style="width:100%"></textarea>
        <div class="actions"><button id="questionSend" class="primary">Send</button></div>
      </div>
    </div>
  </body>
</html>
