quarkus.http.port=8080
%test.quarkus.http.test-port=0
# Snapshot capture writes the whole workspace into the DB; tests do not need it.
%test.engine.revert.snapshot.enabled=false

# Der Schlüssel wird zur Laufzeit aus der Umgebung gelesen.
# Der Fallback dient nur dazu, den Start ohne gesetzte Variable zu ermöglichen.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:demo-key}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.2

# Engine (M14): DB backend is environment-controlled.
quarkus.datasource.db-kind=${engine.db.kind}
quarkus.datasource.jdbc.driver=${ENGINE_DB_DRIVER:}
quarkus.datasource.username=${ENGINE_DB_USER:qoc}
quarkus.datasource.password=${ENGINE_DB_PASSWORD:qoc}
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=classpath:db/migration

engine.provider.scripted=${ENGINE_PROVIDER_SCRIPTED:true}
engine.provider.url=${ENGINE_PROVIDER_URL:${OPENAI_BASE_URL:https://api.openai.com/v1}/chat/completions}
engine.provider.api-key=${OPENAI_API_KEY:demo-key}
engine.model.provider=${ENGINE_MODEL_PROVIDER:openai}
engine.model.id=${ENGINE_MODEL_ID:${OPENAI_MODEL:gpt-4o-mini}}
# Cumulative turn token budget. 0 = no token limit.
engine.turn.max.tokens=${ENGINE_TURN_MAX_TOKENS:0}
engine.workspace=${ENGINE_WORKSPACE:.}
engine.session.temp-dir=${ENGINE_SESSION_TEMP_DIR:sessions}
engine.settings.workspace-enabled=${ENGINE_SETTINGS_WORKSPACE_ENABLED:true}

# Async (durable) approvals
engine.approval.async-enabled=${ENGINE_APPROVAL_ASYNC_ENABLED:false}
engine.approval.timeout-hours=${ENGINE_APPROVAL_TIMEOUT_HOURS:72}
engine.approval.poll-seconds=${ENGINE_APPROVAL_POLL_SECONDS:5}
engine.approval.base-url=${ENGINE_APPROVAL_BASE_URL:http://localhost:8080}
engine.approval.email.smtp-host=${ENGINE_APPROVAL_EMAIL_SMTP_HOST:}
engine.approval.email.smtp-port=${ENGINE_APPROVAL_EMAIL_SMTP_PORT:587}
engine.approval.email.username=${ENGINE_APPROVAL_EMAIL_USERNAME:}
engine.approval.email.password=${ENGINE_APPROVAL_EMAIL_PASSWORD:}
engine.approval.email.from=${ENGINE_APPROVAL_EMAIL_FROM:}
engine.approval.email.to=${ENGINE_APPROVAL_EMAIL_TO:}
engine.approval.email.starttls=${ENGINE_APPROVAL_EMAIL_STARTTLS:true}

# Email tool (IMAP/SMTP) guardrails
engine.email.enabled=${ENGINE_EMAIL_ENABLED:true}
engine.email.read-enabled=${ENGINE_EMAIL_READ_ENABLED:true}
engine.email.attachments-enabled=${ENGINE_EMAIL_ATTACHMENTS_ENABLED:false}
engine.email.allowed-recipients=${ENGINE_EMAIL_ALLOWED_RECIPIENTS:}
engine.email.max-recipients=${ENGINE_EMAIL_MAX_RECIPIENTS:10}
engine.email.max-attachments=${ENGINE_EMAIL_MAX_ATTACHMENTS:5}
engine.email.max-attachment-bytes=${ENGINE_EMAIL_MAX_ATTACHMENT_BYTES:10485760}
engine.email.max-body-chars=${ENGINE_EMAIL_MAX_BODY_CHARS:50000}
engine.email.max-subject-chars=${ENGINE_EMAIL_MAX_SUBJECT_CHARS:200}
engine.email.max-per-hour=${ENGINE_EMAIL_MAX_PER_HOUR:20}
engine.email.imap-host=${ENGINE_EMAIL_IMAP_HOST:}
engine.email.imap-port=${ENGINE_EMAIL_IMAP_PORT:993}
engine.email.imap-ssl=${ENGINE_EMAIL_IMAP_SSL:true}
engine.email.imap-starttls=${ENGINE_EMAIL_IMAP_STARTTLS:true}
engine.email.imap-user=${ENGINE_EMAIL_IMAP_USER:}
engine.email.imap-password=${ENGINE_EMAIL_IMAP_PASSWORD:}
engine.email.smtp-host=${ENGINE_EMAIL_SMTP_HOST:}
engine.email.smtp-port=${ENGINE_EMAIL_SMTP_PORT:587}
engine.email.smtp-starttls=${ENGINE_EMAIL_SMTP_STARTTLS:true}
engine.email.smtp-user=${ENGINE_EMAIL_SMTP_USER:}
engine.email.smtp-password=${ENGINE_EMAIL_SMTP_PASSWORD:}
engine.db.kind=${ENGINE_DB_KIND:postgresql}
engine.db.path=${ENGINE_DB_PATH:./data/qoc.db}

# Dedicated LLM request/response trace: 2 MiB per file, 20 rotating files.
engine.llm-log.enabled=${ENGINE_LLM_LOG_ENABLED:true}
engine.llm-log.path=${ENGINE_LLM_LOG_PATH:${LOG_DIR:./log}/llm.log}
engine.llm-log.limit-bytes=${ENGINE_LLM_LOG_LIMIT_BYTES:2097152}
engine.llm-log.count=${ENGINE_LLM_LOG_COUNT:20}
engine.session.retention-days=${SESSION_RETENTION_DAYS:14}
engine.revert.snapshot.enabled=${ENGINE_REVERT_SNAPSHOT:true}
engine.instructions.enabled=${ENGINE_INSTRUCTIONS_ENABLED:true}
engine.firecrawl.api-key=${FIRECRAWL_API_KEY:}
engine.firecrawl.endpoint=${FIRECRAWL_ENDPOINT:https://mcp.firecrawl.dev/v2/mcp}

# Dev/Prod: Dev Services stay disabled when an explicit URL is provided.
%dev.quarkus.datasource.devservices.enabled=${ENGINE_DB_DEV_SERVICES:true}
%prod.quarkus.datasource.devservices.enabled=false

# Test: Quarkus Dev Services provides PostgreSQL automatically.

# The credential surface must not be reachable from other hosts.
quarkus.http.host=127.0.0.1

# HTTP Basic auth. Empty = off (loopback/trusted development only).
engine.auth.password=${OPENCODE_SERVER_PASSWORD:}


# OpenTelemetry tracing. Exporter endpoint configurable; disabled SDK keeps app runnable without collector.
quarkus.otel.enabled=${OTEL_ENABLED:false}
quarkus.otel.service.name=${OTEL_SERVICE_NAME:qoc-engine}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.enabled=${OTEL_TRACES_ENABLED:false}
quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false

# Logging: console INFO (small), file DEBUG (complete flow) with rotation.
quarkus.log.level=DEBUG
quarkus.log.console.level=INFO
quarkus.log.file.enabled=true
quarkus.log.file.path=${LOG_DIR:./log}/qoc.log
quarkus.log.file.level=DEBUG
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.rotate-on-boot=false
%test.quarkus.log.level=INFO
%test.quarkus.log.file.enable=false

# GraalVM native: initialize ID generators at runtime (SecureRandom).

# Native: include prompt templates from the engine jar.
quarkus.native.resources.includes=prompts/**,db/**,META-INF/services/**,META-INF/a2a-defaults.properties

# OIDC (configured via settings.json or env)
# quarkus.oidc.auth-server-url=${QOC_OIDC_ISSUER:}
# quarkus.oidc.client-id=${QOC_OIDC_CLIENT_ID:}
# quarkus.oidc.credentials.secret=${QOC_OIDC_CLIENT_SECRET:}
quarkus.oidc.enabled=${QUARKUS_OIDC_ENABLED:false}

# A2A client (Phase 1)
# Comma-separated URLs or semicolon-delimited entries: url=...|tool=...|enabled=true
engine.a2a.urls=
# engine.a2a.endpoints=url=http://localhost:9999|id=weather|tool=a2a_weather|enabled=true;
# AgentCard cache for configured A2A agents (seconds, 0 disables caching).
engine.a2a.cache.ttl-seconds=${ENGINE_A2A_CACHE_TTL_SECONDS:300}
# Egress guard for outbound A2A calls (default-open; empty lists allow all).
# engine.a2a.egress.allowedHosts=example.com,api.example.com
# engine.a2a.egress.allowedIps=10.0.0.0/8,192.168.1.5
# engine.a2a.egress.tlsRequired=false

# A2A server (Phase 2)
# Disabled by default: enabling exposes the agent card and JSON-RPC endpoint.
engine.a2a.server.enabled=${ENGINE_A2A_SERVER_ENABLED:false}
engine.a2a.server.name=QOC Agent
engine.a2a.server.description=QOC AI Agent Runtime
engine.a2a.server.version=1.0.0
engine.a2a.server.base-url=${ENGINE_A2A_SERVER_BASE_URL:http://localhost:8080}
# Empty/unset = primary QOC agent.

# The A2A SDK eagerly creates MainEventBusProcessor through this CDI initializer.
# That starts a background thread during native-image generation, which GraalVM
# rejects. Exclude only the eager initializer in native builds; the processor
# itself stays available for DefaultRequestHandler injection.
%native.quarkus.arc.exclude-types=org.a2aproject.sdk.server.events.MainEventBusProcessorInitializer