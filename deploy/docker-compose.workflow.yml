# Workflow Stack: Temporal + workflow-runner + workflow-ui
#
# Start:
#   cd deploy
#   docker compose -f docker-compose.workflow.yml up -d
#
# URLs:
#   Temporal UI:      http://localhost:8233
#   workflow-runner:  http://localhost:8097
#   workflow-ui:      http://localhost:5173
#   QOC Engine:       http://localhost:8080 (separate, via qoc-memory oder qoc-local)

name: qoc-workflow

services:

  # Temporal dev server (gRPC 7233, Web UI 8233)
  temporal:
    image: temporalio/auto-setup:latest
    container_name: qoc-temporal
    restart: unless-stopped
    environment:
      - DB=sqlite
      - SQLITE_PRAGMA_journal_mode=WAL
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/var/lib/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # workflow-runner (Java, Temporal worker + REST API)
  workflow-runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.workflow-runner
    image: qoc-workflow-runner:local
    container_name: qoc-workflow-runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8097:8097"
    volumes:
      - ../wf-data:/data/wf
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # workflow-ui (React + ReactFlow, served via nginx)
  workflow-ui:
    build:
      context: ../workflow-ui
      dockerfile: ../deploy/Dockerfile.workflow-ui
    image: qoc-workflow-ui:local
    container_name: qoc-workflow-ui
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - workflow-runner

volumes:
  temporal-data:
