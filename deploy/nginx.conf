# Example nginx reverse proxy with per-user identification for QOC.
#
# Create password file:
#   htpasswd -c /etc/nginx/.htpasswd opencode
#   htpasswd /etc/nginx/.htpasswd guest
#
# The authenticated username is forwarded as X-QOC-User. Missing header means
# the default "opencode" user.

server {
    listen 80;
    server_name _;

    location / {
        auth_basic "QOC";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-QOC-User $remote_user;

        proxy_buffering off;
    }
}
