services:
  qoc-native:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.native
    image: qoc-engine:native
    container_name: qoc-engine-native
    restart: unless-stopped
    ports:
      - "${QOC_PORT:-8334}:8080"
    volumes:
      - /home/torsten/dev/my-projects/2oc/dws:/data/workspace
      - /home/torsten/dev/my-projects/2oc/qoc/data:/data
      # Native-specific instructions, visible only inside this container.
      - ./AGENTS.native.md:/data/workspace/AGENTS.md:ro
    env_file:
      - .env
    environment:
      - ENGINE_WORKSPACE=/data/workspace
      - LOG_DIR=/data/log
      - HOME=/data/home

