# JVM dev container for QOC.
# Run via: ./deploy/docker-dev/deploy.sh up
services:
  qoc-dev:
    image: qoc-engine:dev
    container_name: qoc-dev
    working_dir: /app
    command: ["/usr/local/bin/entrypoint-dev.sh"]
    restart: unless-stopped
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      QUARKUS_TEST_CONTINUOUS_TESTING: disabled
      QUARKUS_DEV_SERVICES_ENABLED: "false"
      ENGINE_MODEL_ID: glm-5.3-flash
      ENGINE_PERMISSION_DEFAULT: allow-all
      ENGINE_PERMISSION_ASK_MODE: interactive
      ENGINE_WORKFLOW_STORAGE: file
      MAVEN_CONFIG: /home/ubuntu/.m2
      MAVEN_OPTS: -Duser.home=/home/ubuntu
      MAVEN_REPO: /home/ubuntu/.m2
    volumes:
      - ../..:/app
      - ${HOME}/.m2:/home/ubuntu/.m2
      - ./data/home:/data/home
      - ../../data/workspace:/data/workspace
      - ./log:/data/log
      - ../../wf-data:/data/wf
      - ./entrypoint-dev.sh:/usr/local/bin/entrypoint-dev.sh:ro
    ports:
      - "8070:8080"
      - "5006:5006"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-983}"