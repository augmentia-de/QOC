# Native dev container for QOC.
# Run via: ./deploy/docker-oidc-native/deploy.sh up
services:
  qoc-oidc-native:
    image: qoc-engine:dev-native
    container_name: qoc-oidc-native
    working_dir: /app
    command: ["/usr/local/bin/entrypoint-dev-native.sh"]
    restart: unless-stopped
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOME: /data/home
      QUARKUS_TEST_CONTINUOUS_TESTING: disabled
      ENGINE_MODEL_ID: glm-5.3-flash
      ENGINE_PERMISSION_DEFAULT: allow-all
      ENGINE_PERMISSION_ASK_MODE: interactive
      MAVEN_CONFIG: /home/qoc/.m2
      MAVEN_OPTS: -Duser.home=/home/qoc
      MAVEN_REPO: /home/qoc/.m2
      DEV_NATIVE_REBUILD: "never"
      DEV_NATIVE_OIDC: "true"
      RUNNER_FILE: quarkus/target/runner-oidc
      ENGINE_SECURITY_MODE: oidc
      QUARKUS_OIDC_ENABLED: "true"
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/qoc
      # Wichtig: Akzeptiert Tokens, die vom Browser über localhost:8180 angefordert wurden
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8180/realms/qoc
      # Keycloaks Discovery liefert jwks_uri=localhost:8180 (nicht erreichbar im Container).
      # JWKS deshalb absolut über den internen Netzwerknamen laden.
      QUARKUS_OIDC_JWKS_PATH: http://keycloak:8080/realms/qoc/protocol/openid-connect/certs
      # Zusätzlicher Puffer für den OIDC-Discovery-Request beim schnellen Native-Start
      QUARKUS_OIDC_CONNECTION_DELAY: 10S
      QUARKUS_OIDC_TOKEN_AUDIENCE: qoc-engine
      QUARKUS_OIDC_CLIENT_ID: qoc-engine
      QUARKUS_OIDC_CREDENTIALS_SECRET: qoc-engine-local-secret
      QUARKUS_HTTP_AUTH_PERMISSION_AUTHENTICATED_PATHS: /api/*,/mcp/*,/mcp
      QUARKUS_HTTP_AUTH_PERMISSION_AUTHENTICATED_POLICY: authenticated
      # UI runtime config (/config.js) – correct variable names the UI reads
      ENGINE_UI_OIDC_ENABLED: "true"
      ENGINE_UI_OIDC_ISSUER: http://localhost:8180/realms/qoc
      ENGINE_UI_OIDC_CLIENT_ID: qoc-ui
      ENGINE_UI_OIDC_AUDIENCE: qoc-engine
    volumes:
      - ../..:/app
      - ${HOME}/.m2:/home/qoc/.m2
      - ./data/home:/data/home
      - ../../../data/workspace:/data/workspace
      - ./log:/data/log
      - ./entrypoint-dev-native.sh:/usr/local/bin/entrypoint-dev-native.sh:ro
    ports:
      - "8081:8080"
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${DOCKER_GID:-983}"
    networks:
      - default
      - keycloak-local

networks:
  default:
    name: qoc-oidc-native_default
  keycloak-local:
    name: qoc-keycloak_default
    external: true