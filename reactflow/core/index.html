<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/config.js"></script>
    <title>QOC Core</title>
  </head>
  <body>
    <header>
      <h1>QOC Core</h1>
      <button id="questionsBtn" title="Ausstehende Fragen" style="position:relative">❓ <span id="questionsBadge" style="display:none;position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;border-radius:10px;padding:0 5px;font-size:0.7rem;min-width:16px;text-align:center">0</span></button>
      <button id="hardCancelBtn" title="Lauf abbrechen" disabled>✕</button>
      <select id="sessions" title="Session"></select>
      <select id="sessionActions" title="Session-Aktionen" style="background:#2d2d2d;color:#d4d4d4;border:1px solid #555;border-radius:4px;padding:2px 6px;font-size:12px">
        <option value="">Aktionen…</option>
        <option value="new">Neue Session</option>
        <option value="delete">Session löschen</option>
      </select>
      <button id="reloadConfigBtn" style="color:#000;background:#f0ad4e;border:none;font-size:12px;padding:2px 8px;border-radius:4px;cursor:pointer;margin-left:4px">Reload Config</button>
      <select id="agent" title="Agent" style="max-width:30vw"></select>
      <button id="editAgentBtn" title="Agent bearbeiten">✎</button>
      <label class="details-toggle"><input type="checkbox" id="showDetails"> Details</label>
      <span id="status">ready</span>
      <a href="/" style="color:var(--accent);text-decoration:none;margin-left:1rem">Full UI</a>
      <a href="/settings" style="color:var(--accent);text-decoration:none;margin-left:.5rem">Settings</a>
      <a href="/workflows" style="color:var(--accent);text-decoration:none;margin-left:.5rem">Workflows</a>
    </header>
      <button id="loginBtn">Login</button>
    <div id="agentOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center">
      <div style="background:#1e1e1e;padding:8px;border-radius:8px;width:min(900px,95vw);height:min(80vh,720px);overflow:hidden;color:#d4d4d4;font-size:12px;display:flex;flex-direction:column">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 8px">
          <h3 style="margin:0" id="agentOverlayTitle">Agent bearbeiten</h3>
          <button id="agentOverlayClose" style="background:none;border:none;color:#999;cursor:pointer;font-size:16px">x</button>
        </div>
        <iframe id="agentOverlayFrame" src="about:blank" style="flex:1;border:1px solid #333;border-radius:4px;background:#0b0d12"></iframe>
      </div>
    </div>
    <main>
      <div class="chat">
        <div class="messages" id="messages"></div>
        <div class="inputbar" id="inputWrap">
          <textarea id="input" rows="3" placeholder="Prompt eingeben…"></textarea>
          <button id="send">Send</button>
        </div>
      </div>
      <aside class="side">
        <section class="section panel" id="panelQuestions" style="display:none">
          <h2>Ausstehende Fragen <button id="refreshQuestions" style="float:right;background:none;border:none;color:var(--muted);cursor:pointer">↻</button></h2>
          <div id="questionsList"></div>
        </section>
        <section class="section panel" id="panelTasks">
          <h2>Subagents</h2>
          <div id="tasks"></div>
        </section>
        <section class="section panel" id="panelEvents">
          <h2>Ereignisse</h2>
          <div class="logs" id="logs"></div>
        </section>
      </aside>
    </main>
    <div class="modal" id="permModal">
      <div class="box">
        <h3>Permission required</h3>
        <p id="permContext"></p>
        <div class="actions">
          <button id="permReject">Ablehnen</button>
          <button id="permOnce">Einmal</button>
          <button id="permAlways" class="primary">Immer erlauben</button>
        </div>
      </div>
    </div>
    <div class="modal" id="questionModal">
      <div class="box">
        <h3>Frage</h3>
        <div id="questionText"></div>
        <div id="questionOptions" style="display:flex;flex-direction:column;gap:.6rem;margin:.6rem 0"></div>
        <textarea id="questionAnswer" rows="3" placeholder="Antwort…" style="width:100%"></textarea>
        <div class="actions"><button id="questionSend" class="primary">Send</button></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
